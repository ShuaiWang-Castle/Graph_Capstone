[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "degree-contraction-capstone"
version = "0.1.0"
description = "Research implementation of degree-weighted modularity contraction certificates"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "networkx", "sympy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
